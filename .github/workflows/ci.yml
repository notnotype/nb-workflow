name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Check types
        run: bun run typecheck

      - name: Verify Node package
        run: bun run verify:package

      - name: Compile demo
        run: >-
          bun build demo/generate.ts
          --outfile .agent/tmp/demo-compile/generate.js
          --target bun
          --format esm

      - name: Inspect package contents
        run: npm pack --dry-run --json
